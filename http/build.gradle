plugins {
    id "org.jetbrains.kotlin.jvm"
}

repositories {
    google()
    mavenCentral()
}

group scratchGroup
version scratchVersion

def conscryptVersion = '2.6.1'

apply plugin: 'maven-publish'

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
    kotlinOptions.freeCompilerArgs = [
            "-Xallow-kotlin-package",
            "-opt-in=kotlin.Experimental",
            "-opt-in=kotlin.ExperimentalUnsignedTypes",
            "-opt-in=kotlin.ExperimentalStdlibApi"
    ]
}

compileJava {
    targetCompatibility = "1.8"
    sourceCompatibility = "1.8"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    api project(':scratch:base')
    api project(':scratch:atomic')
    api project(':scratch:buffer')
    api project(':scratch:core')

    compileOnly group: 'org.conscrypt', name: 'conscrypt-openjdk-uber', version: conscryptVersion
    compileOnly group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.60'
    compileOnly group: 'org.bouncycastle', name: 'bcpkix-jdk15on', version: '1.60'

    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    testImplementation group: 'org.conscrypt', name: 'conscrypt-openjdk-uber', version: conscryptVersion
    testImplementation group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.60'
    testImplementation group: 'org.bouncycastle', name: 'bcpkix-jdk15on', version: '1.60'
}

apply from: "../maven.gradle"
